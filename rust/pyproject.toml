[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "azlin-rs"
version = "2.6.78"
description = "Azure VM fleet management CLI (Rust) — provision, manage, and monitor development VMs"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Ryan Sweet", email = "rysweet@microsoft.com"}]
readme = {text = "azlin is a command-line tool for provisioning and managing fleets of Azure Linux virtual machines. It creates development VMs from a single command, keeps track of the machines you own, and lets you connect to, monitor, and tear them down again without leaving the terminal. This package ships the Rust implementation as a prebuilt binary.", content-type = "text/plain"}
keywords = ["azure", "vm", "cli", "rust", "devops", "cloud", "provisioning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/ahrkrak/azlin"
Repository = "https://github.com/ahrkrak/azlin"
Documentation = "https://github.com/ahrkrak/azlin/tree/main/docs"

[tool.maturin]
manifest-path = "crates/azlin/Cargo.toml"
bindings = "bin"
